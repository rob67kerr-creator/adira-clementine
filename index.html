<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wonderful Breakthrough of Adira Clementine</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; color: #1a1a1a; overflow-x: hidden; }

    /* ===================== TOP NAV (UPDATED FOR READABILITY) ===================== */
    .top-nav {
      position: sticky; top: 0; z-index: 1000;
      background: #1a1a1a; border-bottom: 4px solid #ffec00;
      display: flex; align-items: stretch; justify-content: center;
      flex-wrap: wrap; padding: 6px 0;
    }
    .top-nav a {
      font-family: 'Nunito', sans-serif;
      font-size: 18px; font-weight: 800;
      color: #ffec00; text-decoration: none;
      padding: 14px 22px;
      border-right: 2px solid #333;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      display: flex; align-items: center;
    }
    .top-nav a:last-child { border-right: none; }
    .top-nav a:hover { background: #ffec00; color: #1a1a1a; }

    /* Special nav colors */
    .nav-sticker { color: #ff9f00; }
    .nav-sticker:hover { background: #ff9f00; color: #1a1a1a; }

    .nav-fanclub { color: #ff2d55; }
    .nav-fanclub:hover { background: #ff2d55; color: #fff; }

    .nav-whois { color: #00c2ff; }
    .nav-whois:hover { background: #00c2ff; color: #1a1a1a; }

    .nav-hot { color: #00ff88; }
    .nav-hot:hover { background: #00ff88; color: #1a1a1a; }

    /* ===================== FLOATING STICKER BUTTON ===================== */
    #float-sticker-btn {
      position: fixed; bottom: 28px; right: 24px; z-index: 9999;
      background: #ffec00; color: #1a1a1a;
      font-family: 'Bangers', cursive; font-size: 18px; letter-spacing: 1.5px;
      padding: 14px 22px; border: 4px solid #1a1a1a; border-radius: 50px;
      box-shadow: 5px 5px 0 #1a1a1a; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
      animation: float-pulse 2.5s ease-in-out infinite;
    }
    #float-sticker-btn:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 #1a1a1a; animation: none; }
    #float-sticker-btn.hidden { opacity: 0; pointer-events: none; }

    @keyframes float-pulse {
      0%,100%{ box-shadow:5px 5px 0 #1a1a1a; transform:translateY(0); }
      50%{ box-shadow:7px 7px 0 #1a1a1a; transform:translateY(-5px); }
    }

    /* ===================== FREE EPISODES HERO ===================== */
    .episodes-hero {
      background-color: #00c2ff;
      border-bottom: 5px solid #1a1a1a;
      padding: 48px 0 0;
      position: relative; overflow: hidden;
    }
    .episodes-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        url('https://cdn.shopify.com/s/files/1/0769/3765/8589/files/part3_007.jpg?v=1762469290'),
        url('https://cdn.shopify.com/s/files/1/0769/3765/8589/files/fan_club_ver_4.jpg?v=1768859346'),
        url('https://cdn.shopify.com/s/files/1/0769/3765/8589/files/fan_club_ver_7.jpg?v=1768859346'),
        url('https://cdn.shopify.com/s/files/1/0769/3765/8589/files/fan_club_ver_10.jpg?v=1768859345');
      background-size: 25% auto, 25% auto, 25% auto, 25% auto;
      background-position: left top, 33% top, 66% top, right top;
      background-repeat: no-repeat;
      filter: sepia(1) brightness(0.6) opacity(0.35);
      mix-blend-mode: multiply; z-index: 0;
    }
    .episodes-hero .section-inner { position: relative; z-index: 1; }
    .section-inner { max-width: 980px; margin: 0 auto; padding: 0 24px; }

    .section-title {
      font-family: 'Bangers', cursive; font-size: 58px; letter-spacing: 2px;
      color: #1a1a1a; text-align: center; margin-bottom: 6px;
      text-shadow: 3px 3px 0 #fff;
    }
    .section-title span { color: #ff2d55; text-shadow: 3px 3px 0 #1a1a1a; }

    .section-sub {
      font-family: 'Fredoka One', cursive; text-align: center;
      font-size: 19px; color: #1a1a1a; margin-bottom: 28px;
    }

    /* Sticker nudge */
    .sticker-nudge {
      background: #7b2fff; border: 4px solid #1a1a1a; border-radius: 12px;
      padding: 16px 24px; display: flex; align-items: center;
      justify-content: center; gap: 16px; margin-bottom: 28px;
      box-shadow: 5px 5px 0 #1a1a1a; flex-wrap: wrap;
    }
    .sticker-nudge-text { font-family: 'Fredoka One', cursive; font-size: 17px; color: #fff; }
    .sticker-nudge-text span { color: #ffec00; font-size: 19px; }

    .btn-nudge-sticker {
      font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 1.5px;
      background: #ffec00; color: #1a1a1a; border: 4px solid #1a1a1a; border-radius: 8px;
      padding: 10px 22px; text-decoration: none; box-shadow: 4px 4px 0 #1a1a1a;
      transition: transform 0.1s, box-shadow 0.1s;
      animation: pulse-btn 2s ease-in-out infinite;
    }
    .btn-nudge-sticker:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #1a1a1a; animation: none; }

    /* Preview grid */
    .preview-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border: 5px solid #1a1a1a; border-radius: 12px;
      overflow: hidden; box-shadow: 8px 8px 0 #1a1a1a;
    }
    .preview-cell { border-right: 4px solid #1a1a1a; position: relative; overflow: hidden; }
    .preview-cell:last-child { border-right: none; }
    .preview-cell img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; transition: transform 0.3s; }
    .preview-cell:hover img { transform: scale(1.06); }

    .preview-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      font-family: 'Bangers', cursive; font-size: 15px; letter-spacing: 1px;
      padding: 8px 10px; text-align: center;
    }
    .preview-cell:nth-child(1) .preview-label { background: #ff2d55; color: #fff; }
    .preview-cell:nth-child(2) .preview-label { background: #7b2fff; color: #fff; }
    .preview-cell:nth-child(3) .preview-label { background: #ff9f00; color: #1a1a1a; }
    .preview-cell:nth-child(4) .preview-label { background: #1a1a1a; color: #ffec00; }

    .preview-cta { text-align: center; padding: 24px 0 0; position: relative; z-index: 1; }
    .preview-cta p { font-family: 'Fredoka One', cursive; font-size: 18px; color: #1a1a1a; }

    .sticker-cta-bar {
      background: #7b2fff; border-top: 5px solid #1a1a1a;
      padding: 24px; text-align: center; margin-top: 32px;
      position: relative; z-index: 1;
    }
    .btn-sticker-bar {
      font-family: 'Bangers', cursive; font-size: 24px; letter-spacing: 2px;
      background: #ffec00; color: #1a1a1a; border: 5px solid #1a1a1a; border-radius: 10px;
      padding: 14px 32px; text-decoration: none; display: inline-block;
      box-shadow: 7px 7px 0 #1a1a1a;
      transition: transform 0.1s, box-shadow 0.1s;
      animation: pulse-btn 2s ease-in-out infinite;
    }
    .btn-sticker-bar:hover { transform: translate(-3px,-3px); box-shadow: 10px 10px 0 #1a1a1a; animation: none; }

    /* ===================== TICKER ===================== */
    .strip-banner {
      background: #1a1a1a; overflow: hidden; white-space: nowrap;
      padding: 11px 0; border-top: 3px solid #ff2d55; border-bottom: 3px solid #ff2d55;
    }
    .strip-text {
      display: inline-block; font-family: 'Bangers', cursive;
      font-size: 20px; letter-spacing: 3px; color: #ffec00;
      animation: ticker 22s linear infinite;
    }
    @keyframes ticker { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }
