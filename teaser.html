<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adira Clementine — Short Teaser | Vista Comics</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --yellow:#ffec00; --red:#ff2d55; --dark:#111; --white:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--dark); color:var(--white);
      font-family:'Comic Neue',cursive;
      min-height:100vh; overflow-x:hidden;
      display:flex; flex-direction:column; align-items:center;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size:18px 18px;
    }
    .wrap { position:relative; z-index:1; width:100%; display:flex; flex-direction:column; align-items:center; }

    .hero { width:100%; text-align:center; padding:24px 20px 20px; border-bottom:6px solid var(--yellow); background:#111; }
    .hero img { width:min(150px,42vw); display:block; margin:0 auto 12px; }
    .presents { font-family:'Bangers',Impact,cursive; letter-spacing:.2em; font-size:clamp(1rem,3vw,1.35rem); color:var(--yellow); }

    .stage { width:100%; padding:34px 16px 44px; display:flex; flex-direction:column; align-items:center; gap:30px; }
    h1 {
      font-family:'Bangers',Impact,cursive; text-align:center; line-height:1;
      letter-spacing:.05em; color:var(--yellow);
      font-size:clamp(2.2rem,7vw,3.8rem);
      text-shadow:4px 4px 0 var(--red);
    }

    .panel { position:relative; width:min(380px,88vw); }
    .frame {
      position:relative; background:#000;
      border:5px solid var(--yellow); box-shadow:9px 9px 0 var(--red);
      aspect-ratio:9/16; overflow:hidden;
    }
    .frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:block; }

    .play-overlay {
      position:absolute; inset:0; width:100%; height:100%; border:0; cursor:pointer;
      background:linear-gradient(180deg, rgba(0,0,0,.05) 40%, rgba(0,0,0,.55) 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:12px;
      padding-bottom:9%; color:var(--white);
    }
    .play-overlay.hidden { display:none; }
    .play-btn {
      width:92px; height:92px; border-radius:50%;
      background:var(--red); border:5px solid var(--yellow); box-shadow:6px 6px 0 #111;
      display:flex; align-items:center; justify-content:center;
      transition:transform .15s;
    }
    .play-btn::after {
      content:''; margin-left:8px;
      border-style:solid; border-width:16px 0 16px 26px;
      border-color:transparent transparent transparent var(--white);
    }
    .play-overlay:hover .play-btn, .play-overlay:focus-visible .play-btn { transform:scale(1.08) rotate(-4deg); }
    .play-text {
      font-family:'Bangers',Impact,cursive; font-size:1.5rem; letter-spacing:.08em;
      color:var(--yellow); text-shadow:2px 2px 0 #111;
    }

    .logo-badge {
      position:absolute; top:-22px; left:-18px; z-index:3; width:82px;
      background:#fff; border:4px solid var(--yellow); box-shadow:4px 4px 0 var(--red);
      transform:rotate(-6deg); padding:3px; pointer-events:none;
    }
    .logo-badge img { width:100%; display:block; }

    .label {
      background:var(--yellow); color:#111; text-align:center;
      border:4px solid var(--yellow); border-top:0;
      font-family:'Bangers',Impact,cursive; font-size:1.15rem; letter-spacing:.06em;
      padding:12px 8px; box-shadow:9px 9px 0 var(--red);
    }
    .frame { margin-bottom:0; box-shadow:none; }
    .panel { box-shadow:9px 9px 0 var(--red); }
    .label { box-shadow:none; }

    .note {
      font-family:'Fredoka One',Arial,sans-serif; text-align:center;
      font-size:1rem; line-height:1.5; color:rgba(255,255,255,.78); max-width:420px;
    }
    .note strong { color:var(--yellow); }
  
    /* Laptop / desktop windows that are wide but not tall: put the headline beside the
       video and shrink the video to fit, so the whole player is visible without scrolling. */
    @media (min-width: 900px) and (max-height: 950px) {
      .hero { display:flex; align-items:center; justify-content:center; gap:16px; padding:10px 20px; }
      .hero img { width:64px; margin:0; }
      .stage {
        display:grid; grid-template-columns: minmax(0,420px) auto; grid-template-areas: "title panel" "note panel";
        grid-template-rows: auto auto; align-content:center; justify-content:center;
        column-gap:70px; row-gap:24px; padding:22px 24px; min-height:calc(100vh - 92px);
      }
      .stage h1 { grid-area:title; align-self:end; text-align:left; font-size:clamp(2.4rem,4.4vw,3.6rem); }
      .stage .note { grid-area:note; align-self:start; text-align:left; }
      .panel { grid-area:panel; width:clamp(200px, calc((100vh - 225px) * 9 / 16), 380px); }
    }
  </style>
</head>
<body>
<div class="wrap">

  <section class="hero">
    <img src="https://cdn.shopify.com/s/files/1/0769/3765/8589/files/Cookie_logo_black.jpg?v=1773676495" alt="Vista Comics Company" />
    <p class="presents">PRESENTS</p>
  </section>

  <section class="stage">
    <h1>Press play to watch<br>our short teaser!</h1>

    <div class="panel">
      <div class="logo-badge">
        <img src="https://cdn.shopify.com/s/files/1/0769/3765/8589/files/Cookie_logo_black.jpg?v=1773676495" alt="" />
      </div>
      <div class="frame">
        <video id="teaser" playsinline preload="metadata" poster="teaser_poster.jpg">
          <source src="teaser.mp4" type="video/mp4" />
          Your browser can't play this video.
        </video>
        <button class="play-overlay" id="play" aria-label="Play the Adira Clementine teaser">
          <span class="play-btn"></span>
          <span class="play-text" id="play-text">PLAY!</span>
        </button>
      </div>
      <div class="label">THE WONDERFUL BREAKTHROUGH OF ADIRA CLEMENTINE</div>
    </div>

    <p class="note">When you're done, <strong>close this tab</strong> to return to the pitch.</p>
  </section>

</div>
<script>
  var v = document.getElementById('teaser');
  var overlay = document.getElementById('play');
  var text = document.getElementById('play-text');

  overlay.addEventListener('click', function () {
    v.setAttribute('controls', '');
    overlay.classList.add('hidden');
    v.play();
  });

  v.addEventListener('ended', function () {
    text.textContent = 'WATCH AGAIN!';
    overlay.classList.remove('hidden');
    v.removeAttribute('controls');
    v.currentTime = 0;
  });
</script>
</body>
</html>
